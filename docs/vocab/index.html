<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDA Vocabulary Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-width: 300px;
      --header-height: 56px;
      --accent: #1a5276;
      --accent-light: #d6eaf8;
      --accent-hover: #154360;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #6c757d;
      --tag-bg: #e8f4f8;
      --tag-text: #1a5276;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      height: var(--header-height);
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      z-index: 10;
    }
    header .logo { font-weight: 700; font-size: 16px; white-space: nowrap; }
    header .logo span { font-weight: 300; opacity: .8; }
    header .search-wrap {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    header .search-wrap input {
      width: 100%;
      padding: 7px 36px 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      background: rgba(255,255,255,.15);
      color: #fff;
      outline: none;
    }
    header .search-wrap input::placeholder { color: rgba(255,255,255,.6); }
    header .search-wrap input:focus { background: rgba(255,255,255,.25); }
    header .search-wrap .search-icon {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      opacity: .7; pointer-events: none; font-size: 14px;
    }
    header .lang-toggle {
      display: flex; gap: 4px; flex-shrink: 0;
    }
    header .lang-toggle button {
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.4);
      background: transparent;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background .15s;
    }
    header .lang-toggle button.active,
    header .lang-toggle button:hover { background: rgba(255,255,255,.2); }

    /* ── Layout ─────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      padding: 14px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .scheme-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }
    .scheme-item {
      padding: 9px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s, border-color .12s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .scheme-item:hover { background: var(--accent-light); }
    .scheme-item.active {
      background: var(--accent-light);
      border-left-color: var(--accent);
    }
    .scheme-item .scheme-name { font-weight: 500; }
    .scheme-item .scheme-count {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* ── Main ─────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Tree panel ─────────────────────────────────────── */
    .tree-panel {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tree-panel h3 {
      font-size: 12px;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .tree-container { overflow-y: auto; flex: 1; padding: 8px 0; }

    .tree-node { user-select: none; }
    .tree-node-row {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 4px;
      margin: 1px 4px;
      gap: 4px;
      transition: background .1s;
    }
    .tree-node-row:hover { background: var(--accent-light); }
    .tree-node-row.selected { background: var(--accent); color: #fff; }
    .tree-node-row.selected .tree-label { color: #fff; }
    .tree-toggle {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-muted); flex-shrink: 0;
      transition: transform .15s;
    }
    .tree-toggle.open { transform: rotate(90deg); }
    .tree-toggle.leaf { opacity: 0; pointer-events: none; }
    .tree-label { font-size: 13px; line-height: 1.3; }
    .tree-children { display: none; padding-left: 18px; }
    .tree-children.open { display: block; }

    /* ── Detail panel ─────────────────────────────────────── */
    .detail-panel {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      background: var(--bg);
    }
    .detail-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-muted); font-size: 15px;
    }

    /* Concept detail */
    .concept-header { margin-bottom: 20px; }
    .concept-title {
      font-size: 22px; font-weight: 700; color: var(--accent);
      margin-bottom: 4px; line-height: 1.3;
    }
    .concept-alt-title { font-size: 15px; color: var(--text-muted); margin-bottom: 8px; }
    .concept-uri {
      font-size: 11px; color: var(--text-muted); font-family: monospace;
      word-break: break-all;
    }
    .concept-uri a { color: var(--text-muted); text-decoration: none; }
    .concept-uri a:hover { text-decoration: underline; }

    .detail-section { margin-bottom: 22px; }
    .detail-section h4 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted);
      margin-bottom: 8px; padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .detail-definition {
      background: var(--surface); border-left: 3px solid var(--accent);
      padding: 10px 14px; border-radius: 0 6px 6px 0;
      font-size: 13px; line-height: 1.6; color: var(--text);
    }
    .notation-badge {
      display: inline-block;
      background: var(--tag-bg); color: var(--tag-text);
      padding: 3px 10px; border-radius: 4px;
      font-family: monospace; font-size: 12px; font-weight: 500;
    }
    .concept-link-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
    .concept-link-list li a {
      display: inline-block;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--accent); text-decoration: none;
      padding: 4px 10px; border-radius: 4px; font-size: 12px;
      transition: background .1s, border-color .1s;
    }
    .concept-link-list li a:hover {
      background: var(--accent-light); border-color: var(--accent);
    }

    /* Scheme overview */
    .scheme-header { margin-bottom: 24px; }
    .scheme-title { font-size: 24px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .scheme-uri { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .scheme-stats { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 8px; text-align: center;
    }
    .stat-box .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-box .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Search results */
    .search-results { padding: 20px 32px; }
    .search-results h3 { font-size: 16px; margin-bottom: 16px; color: var(--text); }
    .search-result-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 10px;
      cursor: pointer; transition: border-color .12s, box-shadow .12s;
    }
    .search-result-item:hover {
      border-color: var(--accent); box-shadow: 0 2px 8px rgba(26,82,118,.1);
    }
    .search-result-label { font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .search-result-meta { font-size: 11px; color: var(--text-muted); }
    .search-result-def { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    mark { background: #fff176; padding: 0 1px; border-radius: 2px; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #aaa; }
  </style>
</head>
<body>

<header>
  <div class="logo">MDA <span>Vocabulary Browser</span></div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Search concepts…" autocomplete="off">
    <span class="search-icon">🔍</span>
  </div>
  <div class="lang-toggle">
    <button id="langEn" class="active" onclick="setLang('en')">EN</button>
    <button id="langNl" onclick="setLang('nl')">NL</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar">
    <h2>Concept Schemes</h2>
    <div class="scheme-list" id="schemeList"></div>
  </nav>
  <div class="main">
    <div class="tree-panel">
      <h3 id="treePanelTitle">Hierarchy</h3>
      <div class="tree-container" id="treeContainer"></div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="detail-empty">Select a concept scheme or concept to view details</div>
    </div>
  </div>
</div>

/therapeutic-modality/ExtraCorporeal_Membran_Oxygenation": {"uri": "https://w3id.org/mda/vocab/therapeutic-modality/ExtraCorporeal_Membran_Oxygenation", "prefLabel": {"en": "Extra Corporeal_Membran_Oxygenation", "nl": "Extra Corporeal_Membran_Oxygenation"}, "definition": {"en": "Extra Corporeal_Membran_Oxygenation", "nl": "Extra Corporeal_Membran_Oxygenation"}, "notation": "ExtraCorporeal_Membran_Oxygenation", "broader": ["https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality"], "narrower": [], "inScheme": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"], "topConceptOf": []}, "https://w3id.org/mda/vocab/therapeutic-modality/RenalReplacementTherapy": {"uri": "https://w3id.org/mda/vocab/therapeutic-modality/RenalReplacementTherapy", "prefLabel": {"en": "Renal Replacement Therapy", "nl": "Renal Replacement Therapy"}, "definition": {"en": "Renal Replacement Therapy", "nl": "Renal Replacement Therapy"}, "notation": "RenalReplacementTherapy", "broader": ["https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality"], "narrower": [], "inScheme": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"], "topConceptOf": []}, "https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality": {"uri": "https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality", "prefLabel": {"en": "Therapeutic Modality", "nl": "Therapeutische modaliteit"}, "definition": {"en": "A therapeutic intervention or treatment modality.", "nl": "Een therapeutische interventie of behandelingsmodaliteit."}, "notation": "TherapeuticModality", "broader": [], "narrower": ["https://w3id.org/mda/vocab/therapeutic-modality/ExtraCorporeal_Membran_Oxygenation", "https://w3id.org/mda/vocab/therapeutic-modality/RenalReplacementTherapy", "https://w3id.org/mda/vocab/therapeutic-modality/ThermoRegulationTherapy", "https://w3id.org/mda/vocab/therapeutic-modality/VentilationTherapy"], "inScheme": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"], "topConceptOf": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"]}, "https://w3id.org/mda/vocab/therapeutic-modality/ThermoRegulationTherapy": {"uri": "https://w3id.org/mda/vocab/therapeutic-modality/ThermoRegulationTherapy", "prefLabel": {"en": "Thermo Regulation Therapy", "nl": "Thermo Regulation Therapy"}, "definition": {"en": "Thermo Regulation Therapy", "nl": "Thermo Regulation Therapy"}, "notation": "ThermoRegulationTherapy", "broader": ["https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality"], "narrower": [], "inScheme": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"], "topConceptOf": []}, "https://w3id.org/mda/vocab/therapeutic-modality/VentilationTherapy": {"uri": "https://w3id.org/mda/vocab/therapeutic-modality/VentilationTherapy", "prefLabel": {"en": "Ventilation Therapy", "nl": "Ventilation Therapy"}, "definition": {"en": "Ventilation Therapy", "nl": "Ventilation Therapy"}, "notation": "VentilationTherapy", "broader": ["https://w3id.org/mda/vocab/therapeutic-modality/TherapeuticModality"], "narrower": [], "inScheme": ["https://w3id.org/mda/vocab/therapeutic-modality/Scheme"], "topConceptOf": []}}};

let currentLang = 'en';
let currentSchemeUri = null;
let currentConceptUri = null;
let searchActive = false;

function label(obj, lang) {
  if (!obj || !obj.prefLabel) return obj && obj.uri ? obj.uri.split('/').pop() : '—';
  return obj.prefLabel[lang] || obj.prefLabel['en'] || obj.prefLabel['_'] || obj.uri.split('/').pop();
}

function defn(obj, lang) {
  if (!obj || !obj.definition) return '';
  return obj.definition[lang] || obj.definition['en'] || obj.definition['_'] || '';
}

function setLang(lang) {
  currentLang = lang;
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.getElementById('langNl').classList.toggle('active', lang === 'nl');
  renderSchemeList();
  if (currentSchemeUri && !searchActive) {
    renderTree(currentSchemeUri);
    if (currentConceptUri) showConceptDetail(currentConceptUri);
    else showSchemeDetail(currentSchemeUri);
  }
}

// ── Scheme sidebar ────────────────────────────────────
function renderSchemeList() {
  const el = document.getElementById('schemeList');
  const sorted = Object.values(VOCAB.schemes).sort((a,b) =>
    label(a, currentLang).localeCompare(label(b, currentLang)));
  el.innerHTML = sorted.map(s => {
    const count = Object.values(VOCAB.concepts).filter(c => c.inScheme.includes(s.uri)).length;
    const active = s.uri === currentSchemeUri ? ' active' : '';
    return `<div class="scheme-item${active}" onclick="selectScheme('${s.uri.replace(/'/g,"\\'")}')">
      <span class="scheme-name">${label(s, currentLang)}</span>
      <span class="scheme-count">${count}</span>
    </div>`;
  }).join('');
}

function selectScheme(uri) {
  currentSchemeUri = uri;
  currentConceptUri = null;
  searchActive = false;
  document.getElementById('searchInput').value = '';
  renderSchemeList();
  renderTree(uri);
  showSchemeDetail(uri);
}

// ── Tree ────────────────────────────────────────────
function renderTree(schemeUri) {
  const s = VOCAB.schemes[schemeUri];
  const title = s ? label(s, currentLang) : 'Hierarchy';
  document.getElementById('treePanelTitle').textContent = title;
  const container = document.getElementById('treeContainer');
  const topConcepts = (s && s.topConcepts) || [];
  container.innerHTML = topConcepts.map(uri => buildTreeNode(uri, 0)).join('');
}

function buildTreeNode(uri, depth) {
  const c = VOCAB.concepts[uri];
  if (!c) return '';
  const children = c.narrower || [];
  const hasChildren = children.length > 0;
  const selected = uri === currentConceptUri ? ' selected' : '';
  const toggleClass = hasChildren ? '' : ' leaf';
  const childrenId = 'tc_' + uri.replace(/[^a-zA-Z0-9]/g,'_');
  return `<div class="tree-node">
    <div class="tree-node-row${selected}" onclick="handleTreeClick('${uri.replace(/'/g,"\\'")}','${childrenId}',event)" data-uri="${uri}">
      <span class="tree-toggle${toggleClass}" id="tog_${childrenId}">▶</span>
      <span class="tree-label">${label(c, currentLang)}</span>
    </div>
    ${hasChildren ? `<div class="tree-children" id="${childrenId}">${children.map(cu => buildTreeNode(cu, depth+1)).join('')}</div>` : ''}
  </div>`;
}

function handleTreeClick(uri, childrenId, event) {
  selectConcept(uri);
  // toggle children
  const childEl = document.getElementById(childrenId);
  const togEl = document.getElementById('tog_' + childrenId);
  if (childEl) {
    const open = childEl.classList.toggle('open');
    if (togEl) togEl.classList.toggle('open', open);
  }
}

function selectConcept(uri) {
  currentConceptUri = uri;
  searchActive = false;
  // update tree selection
  document.querySelectorAll('.tree-node-row').forEach(el => {
    el.classList.toggle('selected', el.dataset.uri === uri);
  });
  showConceptDetail(uri);
}

// ── Detail panels ────────────────────────────────────
function showSchemeDetail(uri) {
  const s = VOCAB.schemes[uri];
  if (!s) return;
  const schemeConcepts = Object.values(VOCAB.concepts).filter(c => c.inScheme.includes(uri));
  const topCount = (s.topConcepts || []).length;
  const d = defn(s, currentLang);
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="scheme-header">
      <div class="scheme-title">${label(s, currentLang)}</div>
      <div class="scheme-uri">${s.uri}</div>
      ${d ? `<div class="detail-definition" style="margin-top:12px;">${d}</div>` : ''}
      <div class="scheme-stats">
        <div class="stat-box"><div class="stat-num">${schemeConcepts.length}</div><div class="stat-label">Concepts</div></div>
        <div class="stat-box"><div class="stat-num">${topCount}</div><div class="stat-label">Top Concepts</div></div>
      </div>
    </div>
    <div class="detail-section">
      <h4>Top Concepts</h4>
      <ul class="concept-link-list">
        ${(s.topConcepts || []).map(cu => {
          const c = VOCAB.concepts[cu];
          return `<li><a href="#" onclick="selectConcept('${cu.replace(/'/g,"\\'")}');return false;">${label(c, currentLang)}</a></li>`;
        }).join('')}
      </ul>
    </div>`;
}

function showConceptDetail(uri) {
  const c = VOCAB.concepts[uri];
  if (!c) return;
  const mainLabel = label(c, currentLang);
  const altLang = currentLang === 'en' ? 'nl' : 'en';
  const altLabel = c.prefLabel[altLang] || '';
  const d = defn(c, currentLang);
  const broader = c.broader.map(bu => VOCAB.concepts[bu]);
  const narrower = c.narrower.map(nu => VOCAB.concepts[nu]).filter(Boolean);
  const schemes = c.inScheme.map(su => VOCAB.schemes[su]).filter(Boolean);

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="concept-header">
      <div class="concept-title">${mainLabel}</div>
      ${altLabel && altLabel !== mainLabel ? `<div class="concept-alt-title">${altLabel} <span style="font-size:11px;color:#aaa">(${altLang.toUpperCase()})</span></div>` : ''}
      <div class="concept-uri"><a href="${c.uri}" target="_blank">${c.uri}</a></div>
    </div>

    ${c.notation ? `<div class="detail-section">
      <h4>Notation</h4>
      <span class="notation-badge">${c.notation}</span>
    </div>` : ''}

    ${d ? `<div class="detail-section">
      <h4>Definition</h4>
      <div class="detail-definition">${d}</div>
    </div>` : ''}

    ${schemes.length ? `<div class="detail-section">
      <h4>In Scheme</h4>
      <ul class="concept-link-list">
        ${schemes.map(s => `<li><a href="#" onclick="selectScheme('${s.uri.replace(/'/g,"\\'")}');return false;">${label(s, currentLang)}</a></li>`).join('')}
      </ul>
    </div>` : ''}

    ${broader.length ? `<div class="detail-section">
      <h4>Broader</h4>
      <ul class="concept-link-list">
        ${broader.filter(Boolean).map(b => `<li><a href="#" onclick="selectConcept('${b.uri.replace(/'/g,"\\'")}');return false;">${label(b, currentLang)}</a></li>`).join('')}
      </ul>
    </div>` : ''}

    ${narrower.length ? `<div class="detail-section">
      <h4>Narrower (${narrower.length})</h4>
      <ul class="concept-link-list">
        ${narrower.map(n => `<li><a href="#" onclick="selectConcept('${n.uri.replace(/'/g,"\\'")}');return false;">${label(n, currentLang)}</a></li>`).join('')}
      </ul>
    </div>` : ''}`;
}

// ── Search ────────────────────────────────────────────
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  const q = this.value.trim();
  if (!q) {
    searchActive = false;
    if (currentSchemeUri) {
      renderTree(currentSchemeUri);
      if (currentConceptUri) showConceptDetail(currentConceptUri);
      else showSchemeDetail(currentSchemeUri);
    } else {
      document.getElementById('detailPanel').innerHTML = '<div class="detail-empty">Select a concept scheme or concept to view details</div>';
      document.getElementById('treeContainer').innerHTML = '';
    }
    return;
  }
  searchTimeout = setTimeout(() => runSearch(q), 150);
});

function highlight(text, q) {
  if (!text) return '';
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function runSearch(q) {
  searchActive = true;
  const ql = q.toLowerCase();
  const results = Object.values(VOCAB.concepts).filter(c => {
    const lbl = Object.values(c.prefLabel || {}).join(' ');
    const def = Object.values(c.definition || {}).join(' ');
    const notation = c.notation || '';
    return (lbl + def + notation).toLowerCase().includes(ql);
  });

  const panel = document.getElementById('detailPanel');
  if (!results.length) {
    panel.innerHTML = `<div class="detail-empty">No results for "<strong>${q}</strong>"</div>`;
    document.getElementById('treeContainer').innerHTML = '';
    document.getElementById('treePanelTitle').textContent = 'Search Results';
    return;
  }

  // Show tree list of results
  document.getElementById('treePanelTitle').textContent = `Results (${results.length})`;
  document.getElementById('treeContainer').innerHTML = results.map(c => {
    const lbl = label(c, currentLang);
    const selected = c.uri === currentConceptUri ? ' selected' : '';
    return `<div class="tree-node-row${selected}" onclick="selectConcept('${c.uri.replace(/'/g,"\\'")}');updateSearchScheme('${c.uri.replace(/'/g,"\\'")}');" data-uri="${c.uri}" style="padding-left:12px;">
      <span class="tree-label">${highlight(lbl, q)}</span>
    </div>`;
  }).join('');

  // Show search results in detail
  panel.innerHTML = `<div class="search-results">
    <h3>${results.length} result${results.length !== 1 ? 's' : ''} for "<strong>${q}</strong>"</h3>
    ${results.map(c => {
      const lbl = label(c, currentLang);
      const d = defn(c, currentLang);
      const schemeName = c.inScheme.map(su => {
        const s = VOCAB.schemes[su];
        return s ? label(s, currentLang) : '';
      }).filter(Boolean).join(', ');
      return `<div class="search-result-item" onclick="selectConcept('${c.uri.replace(/'/g,"\\'")}');updateSearchScheme('${c.uri.replace(/'/g,"\\'")}');">
        <div class="search-result-label">${highlight(lbl, q)}</div>
        <div class="search-result-meta">Scheme: ${schemeName} ${c.notation ? '· <code>'+c.notation+'</code>' : ''}</div>
        ${d ? `<div class="search-result-def">${highlight(d.slice(0,120), q)}${d.length>120?'…':''}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function updateSearchScheme(uri) {
  const c = VOCAB.concepts[uri];
  if (c && c.inScheme.length > 0) {
    currentSchemeUri = c.inScheme[0];
    renderSchemeList();
  }
}

// ── Init ────────────────────────────────────────────
renderSchemeList();
// Select first scheme by default
const firstScheme = Object.values(VOCAB.schemes).sort((a,b) =>
  label(a,'en').localeCompare(label(b,'en')))[0];
if (firstScheme) selectScheme(firstScheme.uri);
</script>

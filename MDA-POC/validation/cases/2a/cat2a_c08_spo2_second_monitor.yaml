id: cat2a_c08_spo2_second_monitor
title: "Desaturation covers low SpO2 on another monitor"
rule: "2a"
purpose: confirm
premise: [P1, P2, P3, P4, P5, P6, P7]
pairs_with: ""
status: active
review: pending
rationale:
  clinical: "A second oximeter's low SpO2 adds nothing while desaturation is announced."
  technical: "Same metric on another sensor, so 2b also silences. Both alarms evidence the oxygenation event."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Desaturatie",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:00",
    end: "08:02:00"}
  - {id: a2,
    device: "DraegerMonitor_00",
    label: "Monitor - Lage SpO2",
    device_name: "DraegerMonitor",
    priority: "Medium",
    start: "08:00:30",
    end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {silenced: a2, reason: redundant, rule: "2a", by: [a1]}
  - {silenced: a2, reason: redundant, rule: "2b", by: [a1]}
  - {interpretation: ReducedPulmonaryFunction, from: "08:00:00", until: "08:02:00", evidence: [a1, a2]}

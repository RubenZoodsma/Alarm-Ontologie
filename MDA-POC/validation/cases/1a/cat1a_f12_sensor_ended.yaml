id: cat1a_f12_sensor_ended
title: "SpO2 sensor reattached before SpO2 low"
rule: "1a"
purpose: falsify
premise: [P2]
pairs_with: "cat1a_c05_spo2_sensor_off"
status: active
review: pending
rationale:
  clinical: "A sensor that is back on says nothing against the new value."
  technical: "Sensor route of f02: Y ends at 20s, X arrives at 30s."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - SpO2-sensor los",
    device_name: "Philipsmonitor",
    priority: "Medium",
    start: "0s",
    end: "20s"}
  - {id: a2,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - SpO2 laag",
    device_name: "Philipsmonitor",
    priority: "Medium",
    start: "30s",
    end: "1m"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: ReducedPulmonaryFunction, from: "30s", until: "1m", evidence: [a2]}

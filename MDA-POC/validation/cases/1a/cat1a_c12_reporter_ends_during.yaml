id: cat1a_c12_reporter_ends_during
title: "Fault ends during SpO2 low: flag stays"
rule: "1a"
purpose: confirm
premise: [P1, P2, P3, P4, P5, P8]
pairs_with: ""
status: active
review: pending
rationale:

id: identity_collision
title: "Each alarm has its own identity"
rule: "engine"
purpose: edge
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    Each alarm has its own identity (patient, device, start, end, ALARM_ID) and so
    its own graphs: the SpO2 alarm ending at 08:00:20 must not take the
    still-active low-MAP alarm with it, which then silences the second low MAP
    (CAT2a, CAT2b). Fails with the former patient + device + start identity
author: "Migrated from DATA/CAT_evaluation (README and regression.py), 2026-10-14"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ABPm laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:00:00", end: "08:05:00"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - SpO2 laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:00:00", end: "08:00:20"}
  - {id: a3, device: "PhilipsMonitor_01", label: "PHILIPSMONITOR - ABPm laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:01:00", end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {silenced: a3, reason: redundant, rule: 2a, by: [a1]}
  - {silenced: a3, reason: redundant, rule: 2b, by: [a1]}
  - {interpretation: ReducedPulmonaryFunction, from: "08:00:00", until: "08:00:20", evidence: [a2]}

  technical: >
    The refinement splits one physical sensor into two identities; still the same
    functional unit and sensor type, so NOT "a different sensor" — no CAT2b firing
    (forbidden firing). The patient still fires a CAT1a flag on a3 (the SpO2
    fault is active). Until 2026-11-25 a3 was also silenced by CAT2a (redundant
    with a1); a flagged alarm now takes part in no other rule, so that second
    verdict is gone.

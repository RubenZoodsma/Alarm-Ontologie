id: cat1b_venous
title: "CAT1b negative: a central venous line is not an arterial line"
rule: "1b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    "CVDm hoog" is on the IBP unit of the same monitor, but its metric
    (VenousBloodPressure) does not approximate ArterialPressure. A venous
    pressure does not show that the heart is beating: the asystole is
    forwarded.
author: "Claude, 2026-11-25 (CAT1b revision)"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - CVDm hoog", device_name: "Philipsmonitor", priority: "Medium", start: "07:55:00", end: "07:55:20"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Asystolie", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:20", evidence: [a2]}

    Ventricular fibrillation has no cardiac output; a pulsatile arterial line
    that stays silent contradicts it as much as it contradicts asystole.
  technical: >
    CAT1b extended to rhythm Fibrillation and its refinements (2026-11-25).
    The arterial line delivered a pressure 5 min earlier and is silent now.

id: cat1b_pulseless_withdraw
title: "CAT1b: 'ABP pulseert niet' during a flagged asystole withdraws the flag"
purpose: confirm
status: active
rule: "1b"
review: pending
author: "Claude, 2026-11-25 (CAT1b: reassuring vs premise-breaking IBP alarms, option A)"
strict: true
rationale:
  clinical: >
    no pulsatility on the arterial line supports a real arrest (sample patient 8918, 2024-12-04 15:13:25).
  technical: >
    A quality state on the arterial line does not reassure, so the arriving
    alarm withdraws the flag; the asystole is evidence for a cardiac arrest
    from then on.

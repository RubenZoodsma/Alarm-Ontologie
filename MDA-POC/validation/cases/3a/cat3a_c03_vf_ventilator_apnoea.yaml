id: cat3a_c03_vf_ventilator_apnoea
title: "VF with ventilator apnoea"
rule: "3a"
purpose: confirm
premise: [P1, P2, P3]
pairs_with: ""
status: active
review: pending
rationale:
  clinical: "Ventricular fibrillation and no breathing at once is a cardiorespiratory arrest."
  technical: "Different sensors (monitor ECG, ventilator). VF counts as cardiac arrest."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "DraegerMonitor_00",
    label: "Monitor - Ventriculaire fibrillatie",
    device_name: "DraegerMonitor",
    priority: "Hoog",
    start: "08:00:00",
    end: "08:01:00"}
  - {id: a2,
    device: "ServoI_00",
    label: "SERVOI - Apneu",
    device_name: "ServoI",
    priority: "Hoog",
    start: "08:00:30",
    end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:01:00", evidence: [a1]}
  - {interpretation: RespiratoryArrest, from: "08:00:30", until: "08:01:30", evidence: [a2]}
  - {interpretation: CardioRespiratoryArrest, from: "08:00:30", until: "08:01:00", evidence: [a1, a2]}

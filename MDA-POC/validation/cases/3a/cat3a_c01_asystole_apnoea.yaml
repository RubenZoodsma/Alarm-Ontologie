id: cat3a_c01_asystole_apnoea
title: "Asystole and apnoea on one monitor"
rule: "3a"
purpose: confirm
premise: [P1, P2, P3]
pairs_with: ""
status: active
review: pending
rationale:
  clinical: "No heart rhythm and no breathing at once is a cardiorespiratory arrest."
  technical: "Both from the same ECG electrodes (a sensor limitation, not the rule's). Span is the overlap. Anchor case."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Asystolie",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:00",
    end: "08:01:00"}
  - {id: a2,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Apneu",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:30",
    end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:01:00", evidence: [a1]}
  - {interpretation: RespiratoryArrest, from: "08:00:30", until: "08:01:30", evidence: [a2]}
  - {interpretation: CardioRespiratoryArrest, from: "08:00:30", until: "08:01:00", evidence: [a1, a2]}

id: cat3a_f08_same_instant
title: "Asystole ends as apnoea starts"
rule: "3a"
purpose: falsify
premise: [P3]
pairs_with: "cat3a_c01_asystole_apnoea"
status: active
review: pending
rationale:
  clinical: "The two arrests must be present at the same time."
  technical: "Boundary: asystole ends at the apnoea's arrival; ends are processed before arrivals."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Asystolie",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:00",
    end: "08:00:30"}
  - {id: a2,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Apneu",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:30",
    end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:30", evidence: [a1]}
  - {interpretation: RespiratoryArrest, from: "08:00:30", until: "08:01:30", evidence: [a2]}
  - {no_interpretation: CardioRespiratoryArrest}

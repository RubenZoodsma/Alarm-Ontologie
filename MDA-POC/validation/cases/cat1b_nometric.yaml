id: cat1b_nometric
title: "CAT1b negative: a disconnect alarm on the arterial line does not show a working line"
rule: "1b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    "ABP losgeraakt" names an arterial transducer but its pathway delivers no
    pressure (no metric). It shows a line exists, not that it works, so it is
    no evidence for CAT1b: the asystole is forwarded.
author: "Claude, 2026-11-25 (CAT1b revision)"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ABP losgeraakt", device_name: "Philipsmonitor", priority: "Hoog", start: "07:55:00", end: "07:55:20"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Asystolie", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:20", evidence: [a2]}

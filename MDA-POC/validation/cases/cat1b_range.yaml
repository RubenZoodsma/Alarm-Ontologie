id: cat1b_range
title: "CAT1b positive: a technical alarm that carries the arterial pressure metric shows a working line"
rule: "1b"
purpose: confirm
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    Presence is recognised by what the line measures: "ABP buiten bereik" is
    technical but its pathway produces ArterialBloodPressure (approximates
    ArterialPressure), so the line delivered an arterial pressure. Ended 10
    min before the asystole, its persistent graph is still in the store.
author: "Claude, 2026-11-25 (CAT1b revision)"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ABP buiten bereik", device_name: "Philipsmonitor", priority: "Medium", start: "07:50:00", end: "07:50:20"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Asystolie", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {silenced: a2, reason: likely-invalid, rule: 1b, by: [a1]}

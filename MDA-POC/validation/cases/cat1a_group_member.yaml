id: cat1a_group_member
title: "CAT1a positive: a fault on the ECG electrode group covers the respiration electrode"
rule: "1a"
purpose: confirm
status: active
review: pending
rationale:
  clinical: >
    With all ECG leads off, the respiration electrodes (the same electrodes)
    are off too, so an impedance-respiration alarm is likely false.
  technical: >
    Kind -> member. "ECG alle leads los" states Disconnected on the electrode
    group (sensor:ElectroCardioGraphy_sensor); impedance respiration starts at
    sensor:ECG_Resp_sensor, a subclass of the group (2026-11-25). CAT1a
    accepts a failed sensor of a strictly broader kind on the same
    functional unit.
author: "Claude, 2026-11-25 (pending fixture from the CAT1a rule header)"
strict: true


id: cat1b_expired
title: "CAT1b negative: an arterial pressure alarm that ended more than 15 minutes ago no longer shows the line"
rule: "1b"
purpose: edge
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    The line is known present only within the post-alarm window (PT15M)
    after its last alarm ended. Ended 20 min before the asystole, its
    persistent graph is gone: the asystole is forwarded (the safe error).
author: "Claude, 2026-11-25 (CAT1b revision)"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ABPs hoog", device_name: "Philipsmonitor", priority: "Medium", start: "07:39:00", end: "07:40:00"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Asystolie", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:20", evidence: [a2]}

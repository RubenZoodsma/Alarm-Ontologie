rationale:
  clinical: ""
  technical: >
    Derivation graph, intermediate signal. The quality state sits on
    signal:ECG_lead, which a lead derivation produces from the electrodes'
    raw signals; the heart-rate step consumes that lead. CAT1a must follow
    analyzedBy/producesSignal from the lead to the step producing the
    alarm's own metric. A one-hop sensor -> signal -> analysis pattern
    cannot reach it.

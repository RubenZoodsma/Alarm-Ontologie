id: cat1b_vt
title: "CAT1b negative: ventricular tachycardia is not flagged by a silent arterial line"
rule: "1b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    VT can have a pulse: a silent arterial line does not make the alarm
    likely false.
  technical: >
    CAT1b covers rhythm Absent or Fibrillation only; VentricularTachycardia
    refines Tachycardia. No clinical event either (VT is not a cardiac arrest).

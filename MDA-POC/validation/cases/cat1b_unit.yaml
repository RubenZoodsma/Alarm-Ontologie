id: cat1b_unit
title: "CAT1b negative: any active alarm on the IBP unit blocks the flag, also a venous one"
rule: "1b"
purpose: edge
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    "Without alarms on that sensing pathway" is checked per IBP functional
    unit (agreed 2026-11-25): the arterial line is known present (ABPs hoog,
    ended 5 min earlier), but a CVD alarm on the same unit is active when
    the asystole arrives, so the pathway is not silent and the asystole is
    forwarded.
author: "Claude, 2026-11-25 (CAT1b revision)"
strict: true

stream:

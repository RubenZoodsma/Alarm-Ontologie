  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - CVDm hoog", device_name: "Philipsmonitor", priority: "Medium", start: "07:59:00", end: "08:01:00"}
  - {id: a3, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Asystolie", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {forwarded: a3}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:20", evidence: [a3]}

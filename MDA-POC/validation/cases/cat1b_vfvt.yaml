id: cat1b_vfvt
title: "CAT1b negative: Philips' combined VF/VT alarm is not flagged by a silent arterial line"
rule: "1b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    If the rhythm is VT with a pulse, the line is silent legitimately and the
    alarm is real; flagging it would hide a real VT.
  technical: >
    CAT1b covers Absent or Fibrillation, not the exact "VF or VT" report
    (held 2026-11-25). The alarm does count as a possible cardiac arrest
    (cardiac_arrest.rq safety extension).
author: "Claude, 2026-11-25 (CAT1b: absent or fibrillation)"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ABPs hoog", device_name: "Philipsmonitor", priority: "Medium", start: "07:55:00", end: "07:55:20"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Ventrikel Fibr/Tachy", device_name: "Philipsmonitor", priority: "Hoog", start: "08:00:00", end: "08:00:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:00:00", until: "08:00:20", evidence: [a2]}

id: site_pa_vs_arterial
title: "Site refinement: low pulmonary artery pressure is not redundant with low arterial pressure"
rule: "2a"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    Pulmonary artery pressure is set by the right ventricle and pulmonary
    vascular resistance, systemic arterial pressure by the left ventricle and
    systemic resistance. A low pulmonary artery pressure while the systemic
    pressure is low is information of its own.
  technical: >
    Both alarms annotate the base ArterialBloodPressure (mean) on one IBP
    functional unit; "Lage PA M" is at site PulmonaryArtery, so the site
    table makes it PulmonaryArteryPressure_Mean, which replaces its base: not
    a subclass of ArterialBloodPressure and approximating PulmonaryArtery-
    Pressure, not ArterialPressure. So neither CAT2a (property) nor CAT2b
    (metric) relates them. Before site refinement (2026-11-25) both were
    ArterialBloodPressure_Mean.
author: "Site refinement, 2026-11-25"
strict: true

stream:
  - {id: a1, device: "DraegerMonitor_00", label: "Monitor - Lage ARTmean", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:00", end: "08:02:00"}
  - {id: a2, device: "DraegerMonitor_00", label: "Monitor - Lage PA M", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:30", end: "08:01:00"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}

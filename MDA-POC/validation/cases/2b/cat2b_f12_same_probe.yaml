id: cat2b_f12_same_probe
title: "Same probe, same metric"
rule: "2b"
purpose: falsify
premise: [P6]
pairs_with: "cat2b_c09_two_probes_one_monitor"
status: active
review: pending
rationale:
  clinical: "Two alarms from one probe are one source, not a second opinion."
  technical: "Desaturatie and SpO2 laag share the probe. 2a still silences."
author: "RZ, 2026-11-26"
start_at: "08:00:00"
strict: true

stream:
  - {id: a1,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - Desaturatie",
    device_name: "Philipsmonitor",
    priority: "Hoog",
    start: "08:00:00",
    end: "08:02:00"}
  - {id: a2,
    device: "PhilipsMonitor_00",
    label: "PHILIPSMONITOR - SpO2 laag",
    device_name: "Philipsmonitor",
    priority: "Medium",
    start: "08:00:30",
    end: "08:01:30"}

expect:
  - {forwarded: a1}
  - {silenced: a2, reason: redundant, rule: "2a", by: [a1]}
  - {interpretation: ReducedPulmonaryFunction, from: "08:00:00", until: "08:02:00", evidence: [a1, a2]}

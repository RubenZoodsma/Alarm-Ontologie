id: cat2a_flagged_incoming
title: "CAT2a negative: an incoming alarm flagged likely false positive is not also silenced as redundant"
rule: "2a"
purpose: edge
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    A flagged alarm takes part in no other rule (agreed 2026-11-25). a2 is
    flagged by CAT1a at arrival (a1: its PPG signal is impaired); without
    the exclusion CAT2a would also silence it as redundant with a0 (same
    property, same direction, equal priority), giving one alarm two
    verdicts.
author: "Claude, 2026-11-25 (CAT2a review)"
strict: true

stream:
  - {id: a0, device: "DraegerMonitor_00", label: "Monitor - Lage SpO2", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:00", end: "08:03:00"}
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - Storing in SpO2", device_name: "Philipsmonitor", priority: "Medium", start: "08:00:10", end: "08:05:00"}
  - {id: a2, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - SpO2 laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:00:30", end: "08:01:00"}

expect:
  - {forwarded: a0}
  - {forwarded: a1}
  - {silenced: a2, reason: likely-invalid, rule: 1a, by: [a1]}
  - {interpretation: ReducedPulmonaryFunction, from: "08:00:00", until: "08:03:00", evidence: [a0]}

id: cat2b_untyped_active
title: "CAT2b negative: an active alarm whose metric has no type justifies no silence"
rule: "2b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    A low ECMO blood flow and a low skin temperature on an incubator report
    different quantities; neither makes the other redundant.
  technical: >
    The active alarm's blueprint (CardioHelp "LPM onder alarmgrens", p99,
    2026-11-25) annotates a metric without a metric type, which the POC mints
    as plain mda:Metric. Because "the same metric" accepts a refinement in
    either direction, every metric type refines mda:Metric, and the untyped
    metric silenced every low alarm on another sensor (61 alarm types in
    rule_coverage.py). An unknown metric must match nothing. If the
    annotation gets a metric type, the case still holds (flow is not skin
    temperature) but no longer exercises the untyped path.
author: "Rule coverage review, 2026-11-25"
strict: true

stream:
  - {id: a1, device: "CardioHelp_00", label: "CARDIOHELP - LPM onder alarmgrens", device_name: "CardioHelp", priority: "Hoog", start: "08:00:00", end: "08:02:00"}
  - {id: a2, device: "BabyLeo_00", label: "MEDIBUS - Central skin temperature < low limit", device_name: "BabyLeo", priority: "Medium", start: "08:00:30", end: "08:01:00"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}

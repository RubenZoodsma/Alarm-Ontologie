id: cat1b_pa_line_neg
title: "CAT1b negative: a pulmonary artery line is not an arterial line"
rule: "1b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    CAT1b doubts an asystole when an arterial line is in place and shows no
    alarm: a working arterial line would show the loss of pulsatile pressure.
    A pulmonary artery catheter does not measure systemic arterial pressure,
    so its presence says nothing about an asystole.
  technical: >
    CAT1b finds its arterial line through a metric approximating
    ArterialPressure. "Lage PA M" annotates ArterialBloodPressure at site
    PulmonaryArtery, which the site table makes PulmonaryArteryPressure_Mean
    (not a subclass of ArterialBloodPressure), so the PA line is not found
    and the asystole is forwarded. With a subclass edge it would have
    inherited ArterialPressure and been taken for an arterial line.
author: "Site refinement, 2026-11-25"
strict: true

stream:
  - {id: a1, device: "DraegerMonitor_00", label: "Monitor - Lage PA M", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:00", end: "08:00:20"}
  - {id: a2, device: "DraegerMonitor_00", label: "Monitor - Asystolie", device_name: "DraegerMonitor", priority: "Hoog", start: "08:10:00", end: "08:10:20"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}
  - {interpretation: CardiacArrest, from: "08:10:00", until: "08:10:20", evidence: [a2]}

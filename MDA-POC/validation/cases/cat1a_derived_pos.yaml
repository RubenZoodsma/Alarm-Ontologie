id: cat1a_derived_pos
title: "CAT1a positive: a Swan-Ganz fault flags a derived metric (EDVI) computed through intermediate metrics"
rule: "1a"
purpose: confirm
status: active
review: pending
rationale:
  clinical: ""
  technical: >
    Derivation graph, metric hops. EDVI is derived from EDV, which is
    derived from stroke volume and RVEF; RVEF comes from the Swan-Ganz
    catheter's thermodilution signal. CAT1a must follow
    analyzedBy/producesMetric through the intermediate metrics, all in the
    alarm's persistent graph, down to the alarm's own metric (the metric
    no further step consumes).
author: "Claude, 2026-11-25 (pending fixture from the CAT1a rule header)"
strict: true


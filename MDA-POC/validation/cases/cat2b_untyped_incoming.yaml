id: cat2b_untyped_incoming
title: "CAT2b negative: an incoming alarm whose metric has no type is not silenced"
rule: "2b"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    A low ECMO blood flow arriving while a low mean arterial pressure is
    active is information in its own right, not a repeat of the pressure.
  technical: >
    The mirror of cat2b_untyped_active: the incoming alarm's metric is
    untyped (minted as plain mda:Metric), and the active alarm's metric type
    (arterial pressure) refines mda:Metric, so the subsumption clause matched.
    An unknown metric must match nothing. If the annotation gets a metric
    type, the case still holds but no longer exercises the untyped path.
author: "Rule coverage review, 2026-11-25"
strict: true

stream:
  - {id: a1, device: "DraegerMonitor_00", label: "Monitor - Lage ARTmean", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:00", end: "08:02:00"}
  - {id: a2, device: "CardioHelp_00", label: "CARDIOHELP - LPM onder alarmgrens", device_name: "CardioHelp", priority: "Hoog", start: "08:00:30", end: "08:01:00"}

expect:
  - {forwarded: a1}
  - {forwarded: a2}

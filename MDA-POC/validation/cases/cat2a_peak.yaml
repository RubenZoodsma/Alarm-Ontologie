  technical: >
    Same process (pulmonary ventilation), same direction, equal priority, but
    different physiological properties: tidal volume approximates
    RespirationVolume, peak pressure RespirationPressure. Since 2026-11-25
    CAT2a requires the same property, so the peak-pressure alarm is NOT
    silenced (it was under the former process-level rule, decision 39).

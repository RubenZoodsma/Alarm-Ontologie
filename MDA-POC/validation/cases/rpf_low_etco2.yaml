id: rpf_low_etco2
title: "A low end-tidal CO2 is not reduced pulmonary function"
rule: "events"
purpose: falsify
status: active
review: pending
rationale:
  clinical: >
    A low end-tidal CO2 reflects measurement, dead space or hyperventilation,
    and does not show that ventilation is inadequate.
  technical: >
    The hypercapnia branch admits only Increased (or narrower) on a PaCO2
    metric; Decreased on the same metric is excluded, as recorded in the
    criterion in clinicalEvents.ttl.
author: "Added 2026-11-25 (hypercapnia branch)"
strict: true

stream:
  - {id: a1, device: "DraegerMonitor_00", label: "Monitor - Lage etCO2", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:00", end: "08:01:00"}

expect:

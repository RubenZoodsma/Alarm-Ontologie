id: cat1a_resp_pos
title: "CAT1a: a loose respiration electrode flags impedance respiration, not the heart rate"
rule: "1a"
purpose: confirm
status: active
review: pending
rationale:
  clinical: >
    "Resp electrode loose" concerns the impedance measurement only; the ECG
    can still be valid.
  technical: >
    "Resp elektr.los" states Disconnected on sensor:ECG_Resp_sensor, which
    starts the impedance-respiration pathway only (2026-11-25). The
    respiration-rate alarm is flagged; the heart-rate alarm, whose pathway
    starts at the electrode group (a broader kind), is not.
author: "Claude, 2026-11-25 (pending fixture from the CAT1a rule header)"
strict: true


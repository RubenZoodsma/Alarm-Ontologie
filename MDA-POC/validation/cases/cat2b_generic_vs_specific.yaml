id: cat2b_generic_vs_specific
title: "CAT2b direction: a specific active SpO2 covers a generic incoming one, not the reverse"
rule: "2b"
purpose: edge
status: active
review: pending
rationale:
  clinical: >
    A low pre-ductal SpO2 already says what a low SpO2 of unknown site says;
    the reverse does not hold: an unsited low SpO2 does not tell where the
    blood was desaturated, so it cannot stand in for the pre-ductal reading.
  technical: >
    "SpO2pr laag" is SpO2 at site PreDuctal, i.e. SpO2_PreDuctal, a narrower
    SpO2 (it keeps SaO2). Since 2026-11-25 CAT2b's "same metric" requires the
    active metric to equal or refine the incoming one: phase 1 (pre-ductal
    active, unsited incoming) silences under CAT2b, phase 2 (unsited active,
    pre-ductal incoming) does not. CAT2a still silences in both phases: both
    approximate SaO2 at equal priority, which is the property-level rule.
    Two monitors, so the probes are different sensors.
author: "Site refinement, 2026-11-25"
strict: true

stream:
  - {id: a1, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ?? SpO2pr laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:00:00", end: "08:02:00"}
  - {id: a2, device: "DraegerMonitor_00", label: "Monitor - Lage SpO2", device_name: "DraegerMonitor", priority: "Medium", start: "08:00:30", end: "08:01:00"}
  - {id: a3, device: "DraegerMonitor_00", label: "Monitor - Lage SpO2", device_name: "DraegerMonitor", priority: "Medium", start: "08:30:00", end: "08:32:00"}
  - {id: a4, device: "PhilipsMonitor_00", label: "PHILIPSMONITOR - ?? SpO2pr laag", device_name: "Philipsmonitor", priority: "Medium", start: "08:30:30", end: "08:31:00"}


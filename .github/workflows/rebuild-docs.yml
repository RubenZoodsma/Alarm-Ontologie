name: Rebuild published docs (graph + vocab direct; ontology + cq via PR)

# Regenerates the four docs/ pages that have a known, reproducible build
# process, SPLIT BY RISK into two independent jobs.
#
# WHY THE SPLIT
# -------------
# These four outputs are not the same kind of thing, and treating them alike
# was wrong in both directions — it held back deterministic re-renders behind
# a review nobody was doing, while lumping in two outputs that genuinely do
# need one.
#
#   publish-visual   docs/graph/ and docs/vocab/ — pushed STRAIGHT to main.
#     Both are self-contained HTML re-renders of the framework, produced by
#     deterministic scripts from the .ttl files already committed in the same
#     push. There is no judgement in them: if the framework changed, the page
#     is simply out of date until it is rebuilt. Nothing downstream consumes
#     them as data.
#
#   propose-reviewed  docs/ontology/ and docs/cq/ — opened as a PR.
#     Neither is "just visual notation":
#
#     docs/ontology/ is the DEREFERENCEABLE ONTOLOGY. w3id.org/mda/ontology
#     302-redirects to this directory, which publishes ontology.ttl, .nt,
#     .owl and .jsonld alongside the rendered page. Whatever lands here is
#     what every downstream consumer resolves at the persistent identifier.
#     It is also produced by WIDOCO with -rewriteAll, which overwrites the
#     whole output folder, using flags that are a best-effort match to the
#     site's existing structure rather than a recovered original config — so
#     its output is worth a human glance, not a blind trust.
#
#     docs/cq/ is EVALUATION OUTPUT, not decoration: per-competency-question
#     result counts and rows. A wrong number here is a wrong published
#     finding. Stale is recoverable; published-and-wrong is not. This page
#     must not auto-publish while any .rq file is out of step with the
#     ontology (e.g. a query still naming a renamed property returns zero
#     rows rather than failing).
#
# NO LOOP RISK from the direct push: docs/** is deliberately absent from the
# paths filter below, and GitHub does not re-trigger workflows for pushes
# made with the default GITHUB_TOKEN in any case. Both, on purpose.
#
# The two jobs are independent (no `needs`) so a WIDOCO or CQ failure never
# blocks the deterministic re-render, which was the previous behaviour: the
# job aborted mid-way and the site silently stayed months out of date.

on:
  push:
    branches: [main]
    paths:
      - 'FRAMEWORK/**/*.ttl'
      - 'CODE/evaluation_qa/archetype_report.py'
      - 'CODE/evaluation_qa/vocab_browser.py'
      - 'CODE/shared/graph_view.py'
      - 'CODE/shared/ontology_tree.py'
      - 'EVALUATION/CQs/**/*.rq'
      - 'CODE/evaluation_cq/cq_QA.py'
      - 'CODE/evaluation_cq/cq_temporal_QA.py'
      - 'CODE/evaluation_cq/cq_report_html.py'
      - 'CODE/evaluation_poc/core/op_knowledge.py'
      - 'DATA/CQ_evaluation/events_data.csv'
  workflow_dispatch: {}

# Serialise runs: two pushes in quick succession would otherwise race each
# other pushing to main. Queue rather than cancel — a cancelled run would
# leave the site half-rebuilt.
concurrency:
  group: rebuild-docs
  cancel-in-progress: false

jobs:
  # ── Deterministic re-renders → straight to main ────────────────────────
  publish-visual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install rdflib owlrl pandas

      - name: Regenerate docs/graph (Knowledge Graphs page)
        run: python3 CODE/evaluation_qa/archetype_report.py --no-open

      - name: Regenerate docs/vocab (Vocabulary Browser data)
        run: python3 CODE/evaluation_qa/vocab_browser.py

      # Scoped to the two directories this job owns, so an unrelated stray
      # file in the runner's tree can never ride along into main.
      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/graph docs/vocab
          if git diff --cached --quiet; then
            echo "No change to docs/graph or docs/vocab — nothing to push."
            exit 0
          fi
          git commit -m "docs: re-render graph + vocab from current framework"
          # main may have moved while the reasoner was running.
          git pull --rebase origin main
          git push origin HEAD:main

  # ── Ontology + evaluation output → PR for review ───────────────────────
  propose-reviewed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install rdflib owlrl pandas

      - name: Regenerate docs/cq (Competency Questions page)
        run: python3 CODE/evaluation_cq/cq_report_html.py

      # Image is ghcr.io/dgarijo/widoco, NOT dgarijo/widoco — the latter has
      # never existed on Docker Hub, so this step failed with "pull access
      # denied ... repository does not exist" on every run it has ever had.
      # The docs/ontology/ pages currently published were therefore not built
      # by this job.
      #
      # Pinned to v1.4.25 rather than :latest deliberately, for the same
      # reason this job goes through review at all — see the header.
      - name: Regenerate docs/ontology (WIDOCO)
        run: |
          mkdir -p docs/ontology
          docker run --rm \
            -v "${{ github.workspace }}:/usr/local/widoco/in" \
            -v "${{ github.workspace }}/docs:/usr/local/widoco/out" \
            ghcr.io/dgarijo/widoco:v1.4.25 \
            -ontFile /usr/local/widoco/in/FRAMEWORK/ONTOLOGY/ontology.ttl \
            -outFolder /usr/local/widoco/out/ontology \
            -rewriteAll -webVowl -getOntologyMetadata -lang en

      # The container runs as root, so everything it wrote is root-owned and
      # the commit step below cannot stage it.
      - name: Restore ownership of WIDOCO output
        run: sudo chown -R "$(id -u):$(id -g)" docs/ontology

      - name: Open PR with regenerated ontology + CQ pages
        uses: peter-evans/create-pull-request@v6
        with:
          # Scoped so this PR can never contain (and therefore never revert)
          # the docs/graph or docs/vocab changes publish-visual pushes to main
          # independently of it.
          add-paths: |
            docs/cq/**
            docs/ontology/**
          commit-message: "docs: regenerate published ontology and CQ pages"
          title: "Auto: regenerate docs/ontology and docs/cq"
          body: |
            Automated regeneration triggered by a change under `FRAMEWORK/**/*.ttl`,
            `EVALUATION/CQs/**/*.rq`, or one of the report scripts themselves.

            - `docs/ontology/` rebuilt via WIDOCO
            - `docs/cq/` rebuilt via `CODE/evaluation_cq/cq_report_html.py`

            `docs/graph/` and `docs/vocab/` are **not** in this PR — they are
            deterministic re-renders and are pushed straight to `main` by the
            `publish-visual` job.

            **Please check two things before merging.**

            1. `docs/ontology/` is what `w3id.org/mda/ontology` resolves to,
               including the `.ttl`/`.nt`/`.owl`/`.jsonld` serialisations.
               WIDOCO runs with `-rewriteAll`, so this diff is what every
               downstream consumer will dereference.
            2. `docs/cq/` carries evaluation results. Confirm no competency
               question has silently dropped to zero rows — that is the
               signature of a `.rq` file still naming a property the ontology
               has since renamed, which returns nothing rather than failing.
          branch: auto/regenerate-docs
          delete-branch: true
